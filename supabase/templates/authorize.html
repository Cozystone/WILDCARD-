<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light only" />
    <title>W* RECORD ACCESS / AUTHORIZATION REQUEST</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f2ed;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2ed;">
      <tr>
        <td align="center" style="padding:56px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;text-align:left;color:#0b0b0a;font-family:'Courier New',Courier,monospace;">
            <tr>
              <td style="font-size:11px;letter-spacing:0.14em;padding-bottom:44px;">W* RECORD ACCESS / AUTHORIZATION REQUEST</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.6;padding-bottom:36px;">A request was made to access your WILDCARD* record.</td>
            </tr>
            <tr>
              <td style="font-family:Helvetica,Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;letter-spacing:0.01em;padding-bottom:40px;">WHO DECIDES WHAT YOU ARE?</td>
            </tr>
            <tr>
              <td style="padding-bottom:36px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:11px 14px;border:1px solid #0b0b0a;color:#0b0b0a;text-decoration:none;font-size:13px;letter-spacing:0.14em;">[ AUTHORIZE ACCESS ]</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;line-height:1.7;padding-bottom:36px;">Or give the terminal this code: <span style="font-weight:700;letter-spacing:0.28em;">{{ .Token }}</span></td>
            </tr>
            <tr>
              <td style="font-size:12px;line-height:1.7;color:#5b5a56;padding-bottom:48px;">If this wasn&#39;t you, ignore this transmission.</td>
            </tr>
            <tr>
              <td style="font-size:11px;letter-spacing:0.14em;">WILDCARD*</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
